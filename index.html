<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Лесоруб PRO</title>
<style>
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;font-family:'Segoe UI',Roboto,sans-serif}
button{font:inherit;cursor:pointer}
#game{position:relative;width:100%;height:100%;image-rendering:pixelated;color:#fff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}

/* HUD */
.hud{position:absolute;top:16px;left:16px;display:flex;gap:12px;flex-wrap:wrap;z-index:4}
.panel{background:rgba(21,27,34,0.85);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,0.15);box-shadow:0 8px 32px rgba(0,0,0,0.37);padding:8px 14px;border-radius:8px;font-weight:bold;font-size:14px;display:flex;align-items:center;gap:6px}
.money{color:#ffd65a}.wood{color:#e29b57}

/* Навигация */
.nav-tabs{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:6}
.nav-btn{padding:10px 16px;background:rgba(27,37,45,0.85);backdrop-filter:blur(6px);color:#fff;border:2px solid rgba(255,255,255,0.15);border-radius:8px;font-weight:bold;font-size:13px;transition:all .2s}
.nav-btn:hover,.nav-btn.active{background:#4f7044;border-color:#73a164;transform:translateY(-2px)}
.nav-btn.edit-active{background:#d35400;border-color:#e67e22}

/* Выбор миров */
.world-selector{position:absolute;top:70px;left:16px;display:flex;gap:6px;z-index:6;flex-wrap:wrap;max-width:500px}
.world-btn{padding:6px 12px;background:rgba(21,27,34,0.85);color:#aaa;border:1px solid rgba(255,255,255,0.15);border-radius:6px;font-size:12px;font-weight:bold;transition:0.2s}
.world-btn:hover:not(:disabled){color:#fff;border-color:rgba(255,255,255,0.4)}
.world-btn.active{background:#2980b9;color:#fff;border-color:#3498db}
.world-btn:disabled{opacity:0.4;cursor:not-allowed;background:rgba(10,10,10,0.6)}

/* Управление этажами */
.home-controls{position:absolute;top:70px;right:16px;display:none;flex-direction:column;align-items:flex-end;gap:10px;z-index:6}
.control-group{display:flex;gap:6px;background:rgba(21,27,34,0.85);padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.15)}
.control-btn{padding:6px 10px;background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:6px;font-size:11px;font-weight:bold}
.control-btn.active{background:#2980b9;border-color:#3498db}

#hint{position:absolute;left:50%;bottom:85px;transform:translateX(-50%);z-index:5;text-align:center;min-width:280px;border-radius:20px}

/* Модальное окно магазина */
.modal{position:absolute;inset:0;background:rgba(11,17,24,0.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:15}
.modal-box{width:min(860px,94vw);max-height:86vh;overflow:auto;background:#161f28;border:2px solid #3a4751;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,0.6);padding:24px}
.modal-box h1{margin:0 0 6px;color:#ffd65a;font-size:26px}
.modal-sub{color:#aebbc4;margin-bottom:18px;font-size:14px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#0e151d;border:2px solid #28343f;border-radius:10px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;transition:0.2s}
.card:hover{border-color:#536677}
.card.owned{border-color:#27ae60;background:#0d2318}
.card.active-axe{border-color:#f1c40f;background:#26210e}
.card h3{margin:0 0 6px;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px}

.card-preview{width:40px;height:40px;object-fit:contain;background:rgba(255,255,255,0.05);border-radius:6px;padding:2px}

.card p{color:#8c9ea9;font-size:12px;margin-bottom:12px;line-height:1.4}
.btn-buy{width:100%;padding:10px;background:#8f633e;color:#fff;border:0;border-radius:6px;font-weight:bold;transition:0.2s}
.btn-buy:hover{background:#a8744a}.btn-buy:disabled{background:#2a333a;color:#616e77;cursor:not-allowed}
.btn-select{background:#27ae60}.btn-select:hover{background:#2ecc71}
.btn-equipped{background:#f1c40f;color:#000;cursor:default}.btn-equipped:hover{background:#f1c40f}
.close-btn{margin-top:18px;padding:10px 20px;background:#24303a;color:#fff;border:1px solid #44535f;border-radius:6px}

/* Рубка */
#chop{position:absolute;inset:0;display:none;z-index:8;background:#000}
#chopCanvas{position:absolute;inset:0;width:100%;height:100%}
.chopUI{position:absolute;right:6%;top:15%;width:min(340px,80vw)}
.bar{height:32px;border:3px solid #283642;background:#0d1319;border-radius:16px;position:relative;overflow:hidden;margin:12px 0;box-shadow:inset 0 2px 5px #000}
.hp-bar-bg{height:22px;border:2px solid #283642;background:#0d1319;border-radius:11px;position:relative;overflow:hidden;margin:8px 0;box-shadow:inset 0 2px 5px #000}
.hp-bar-fill{height:100%;width:100%;background:linear-gradient(90deg, #ff5252, #ff7979);transition:width 0.2s ease-out}
.hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000}
.target{position:absolute;top:0;bottom:0;width:22%;left:39%;background:linear-gradient(90deg,#4caf50,#81c784,#4caf50);border-left:2px solid #a5d6a7;border-right:2px solid #a5d6a7}
.needle{position:absolute;top:0;bottom:0;width:6px;background:#ffeb3b;left:0%;transform:translateX(-50%);box-shadow:0 0 10px #ffeb3b}
#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(21,27,34,0.95);border:2px solid #455765;padding:10px 20px;border-radius:20px;display:none;pointer-events:none;font-weight:bold}

.actionbar{position:absolute;right:20px;bottom:20px;z-index:7;display:flex;flex-direction:column;gap:12px}
.actionbtn{min-width:140px;padding:14px 20px;background:#27333c;color:#fff;border:2px solid rgba(255,255,255,0.2);border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,0.4);font-weight:bold;font-size:15px;touch-action:manipulation;transition:0.15s}
.actionbtn:active{transform:scale(0.96)}
.actionbtn.shop{background:linear-gradient(135deg,#8f633e,#6d482c)}
.actionbtn.chop{background:linear-gradient(135deg,#4f7044,#37522f)}

#joystickArea{display:block;position:absolute;left:20px;bottom:20px;width:120px;height:120px;background:rgba(255,214,90,0.08);border:2px dashed rgba(255,255,255,0.25);border-radius:50%;z-index:7;touch-action:none}
#joystickStick{position:absolute;left:35px;top:35px;width:50px;height:50px;background:rgba(255,214,90,0.5);border:2px solid #ffd65a;border-radius:50%;pointer-events:none;box-shadow:0 0 15px rgba(255,214,90,0.3)}

@media(max-width:700px){
  .hud{font-size:12px}
  .world-selector{top:110px;left:16px}
  .nav-tabs{top:auto;bottom:20px;left:20px;right:auto;flex-direction:column}
  .home-controls{top:auto;bottom:160px;right:20px}
  #joystickArea{left:20px;bottom:150px}
  #hint{bottom:140px;font-size:12px}
  .chopUI{left:10%;right:10%;width:80%;top:8%}
}
</style>


<style id="phone-joystick">
@media (max-width:700px), (pointer:coarse){
  #joystickArea{
    display:block !important;
    left:14px !important;
    bottom:calc(14px + env(safe-area-inset-bottom)) !important;
    width:120px !important;
    height:120px !important;
    z-index:20 !important;
  }
  #joystickStick{
    width:50px !important;
    height:50px !important;
    left:33px !important;
    top:33px !important;
  }
}
</style>

<style id="small-phone-ui">
@media (max-width:700px), (pointer:coarse){
  .hud{top:6px !important;left:6px !important;right:6px !important;gap:4px !important}
  .panel{min-height:32px !important;padding:5px 8px !important;border-radius:8px !important;font-size:11px !important}
  .nav-tabs{top:6px !important;right:6px !important;gap:4px !important}
  .nav-btn{min-height:34px !important;min-width:58px !important;padding:6px 8px !important;border-radius:8px !important;font-size:10px !important}
  .world-selector{top:48px !important;left:6px !important;right:6px !important;gap:4px !important}
  .world-btn{min-height:32px !important;padding:6px 9px !important;border-radius:8px !important;font-size:10px !important}
  .actionbar{left:6px !important;right:6px !important;bottom:6px !important;gap:5px !important}
  .actionbtn{min-height:42px !important;padding:7px 6px !important;border-radius:9px !important;font-size:11px !important}
  #joystickArea{
    width:96px !important;height:96px !important;
    left:8px !important;bottom:8px !important;
  }
  #joystickStick{
    width:40px !important;height:40px !important;
    left:26px !important;top:26px !important;
  }
  #toast{top:54px !important;left:6px !important;right:6px !important;padding:7px 10px !important;border-radius:10px !important;font-size:11px !important}
  .chopUI .actionbtn{min-height:46px !important;font-size:12px !important}
}
</style>

<style id="compact-phone-actions">
@media (max-width:700px), (pointer:coarse){
  .actionbar{
    left:auto !important;
    right:8px !important;
    bottom:calc(8px + env(safe-area-inset-bottom)) !important;
    width:auto !important;
    flex-direction:column !important;
    align-items:flex-end !important;
    gap:5px !important;
  }
  .actionbar .actionbtn{
    flex:none !important;
    width:105px !important;
    min-width:105px !important;
    min-height:36px !important;
    height:36px !important;
    padding:5px 7px !important;
    border-radius:8px !important;
    font-size:10px !important;
  }
}
</style>
</head>
<body>
<div id="game">
<canvas id="world"></canvas>

<div class="hud">
 <div class="panel">💰 <span class="money" id="money">0</span> $</div>
 <div class="panel">🪵 <span class="wood" id="wood">0</span></div>
 <div class="panel">🪓 <span id="axeName">Нет топора</span></div>
 <div class="panel" id="timeIndicator">☀️ День</div>
</div>

<div class="world-selector" id="worldSelector"></div>

<div class="nav-tabs">
 <button class="nav-btn active" id="btnWorld">🗺️ МИР</button>
 <button class="nav-btn" id="btnHome">🏠 ДОМ</button>
 <button class="nav-btn" id="btnEdit" style="display:none">✏️ МЕБЕЛЬ</button>
 <button class="nav-btn" id="btnScaleUp" style="display:none">🔍+</button>
 <button class="nav-btn" id="btnScaleDown" style="display:none">🔍-</button>
 <button class="nav-btn" id="btnFlip" style="display:none">🪞 ОТЗЕРКАЛИТЬ</button>
 <button class="nav-btn" id="btnShop">🛒 МАГАЗИН</button>
</div>

<!-- Управление этажами -->
<div class="home-controls" id="homeControls">
 <div class="control-group">
   <button class="control-btn active" id="btnFloor1">1 Этаж</button>
   <button class="control-btn" id="btnFloor2" style="display:none">2 Этаж</button>
   <button class="control-btn" id="btnFloor3" style="display:none">3 Этаж</button>
 </div>
</div>

<div id="hint" class="panel">Перемещайся и подойди к магазину</div>

<div id="joystickArea"><div id="joystickStick"></div></div>

<div class="actionbar">
 <button class="actionbtn shop" id="shopAction">🛒 МАГАЗИН</button>
 <button class="actionbtn chop" id="chopAction">🪓 РУБИТЬ</button>
</div>

<!-- Модальное окно магазина -->
<div id="shopModal" class="modal"><div class="modal-box">
 <h1>МАГАЗИН ЛЕСОРУБА</h1>
 <div class="modal-sub">Покупка мебели, топоров и локаций</div>
 <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
   <button class="nav-btn active" id="tabAxes">Топоры</button>
   <button class="nav-btn" id="tabBiomes">Локации (6)</button>
   <button class="nav-btn" id="tabFurniture">Мебель</button>
   <button class="nav-btn" id="tabHouse">Дом</button>
 </div>
 <div id="shopContent"></div>
 <button class="close-btn" id="closeShop">Закрыть [ESC]</button>
</div></div>

<div id="chop">
 <canvas id="chopCanvas"></canvas>
 <div class="chopUI">
   <div class="panel" style="justify-content:center"><b>ПРОЧНОСТЬ ДЕРЕВА</b></div>
   <div class="hp-bar-bg">
     <div class="hp-bar-fill" id="hpFill"></div>
     <div class="hp-text" id="hpText">5 / 5 HP</div>
   </div>
   <div class="panel" style="justify-content:center;margin-top:10px"><b>ТОЧНОСТЬ УДАРА</b></div>
   <div class="bar"><div class="target"></div><div class="needle" id="needle"></div></div>
   <button class="actionbtn chop" id="hitAction" style="width:100%;margin-top:5px;padding:16px">🪓 УДАРИТЬ (Пробел / E)</button>
 </div>
</div>
<div id="toast"></div>
</div>

<script>
const W=1200, H=700;
const world=document.getElementById('world'), ctx=world.getContext('2d');
const chop=document.getElementById('chop'), cc=document.getElementById('chopCanvas'), cctx=cc.getContext('2d');

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

let money=0, wood=0, axe=-1, hasAxe=false, currentZone='world'; 
let currentBiome=0, currentFloor=1, unlockedFloors=1;
let editMode=false, draggingItem=null, selectedItem=null, dragOffsetX=0, dragOffsetY=0;
let chopping=false, progress=0, needlePos=0, needleDir=1;
let axeSwingAnim=0;
let player={x:600, y:420, vx:0, vy:0, walkFrame:0, facing:'right'};
let keys={}, trees=[], particles=[];
let currentTree=null, screenShake=0, lastTime=performance.now();
let firstWoodSold = false; 

// Логика времени суток
let isNight = false;
let stars = [];

function checkTimeOfDay() {
  const hour = new Date().getHours();
  // Ночной режим активен с 20:00 до 06:00
  const newNight = (hour >= 20 || hour < 6);
  if (newNight !== isNight) {
    isNight = newNight;
    const timeInd = document.getElementById('timeIndicator');
    if (timeInd) timeInd.textContent = isNight ? '🌙 Ночь' : '☀️ День';
  }
}

// Генерируем звёзды для ночного неба
for(let i=0; i<60; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * 260,
    size: Math.random() * 2 + 1,
    alpha: Math.random()
  });
}

const shopBounds = { x: 480, y: 150, w: 320, h: 250 };

let placedFurniture=[
  {id:'carpet', x:630, y:320, w:130, h:80, floor:1, flipX:false, scale:1, layer:0},
  {id:'bed', x:300, y:300, w:120, h:70, floor:1, flipX:false, scale:1, layer:1},
  {id:'table', x:650, y:340, w:90, h:55, floor:1, flipX:false, scale:1, layer:1},
  {id:'tv', x:655, y:330, w:80, h:50, floor:1, flipX:false, scale:1, layer:2}
];

const axes=[
  {id:'axe_stone', name:'Каменный топор', speed:80, power:1, price:0, owned:true, image:'images/axe_stone.png', glow:null},
  {id:'axe_rusty', name:'Ржавый топор', speed:110, power:2, price:80, owned:false, image:'images/axe_rusty.png', glow:null},
  {id:'axe_steel', name:'Стальной топор', speed:140, power:4, price:200, owned:false, image:'images/axe_steel.png', glow:null},
  {id:'axe_battle', name:'Железный Боевой', speed:170, power:7, price:450, owned:false, image:'images/axe_battle.png', glow:null},
  {id:'axe_gold', name:'Золотой топор', speed:200, power:12, price:900, owned:false, image:'images/axe_gold.png', glow:'#f39c12'},
  {id:'axe_emerald', name:'Изумрудный Секач', speed:230, power:20, price:1800, owned:false, image:'images/axe_emerald.png', glow:'#27ae60'},
  {id:'axe_mithril', name:'Мифриловый топор', speed:270, power:32, price:3500, owned:false, image:'images/axe_mithril.png', glow:'#48dbfb'},
  {id:'axe_magma', name:'Магматический', speed:310, power:50, price:7000, owned:false, image:'images/axe_magma.png', glow:'#ff6b81'},
  {id:'axe_astral', name:'Астральный Левиафан', speed:360, power:85, price:15000, owned:false, image:'images/axe_astral.png', glow:'#8854d0'}
];

const biomes=[
  {id:'alpine', name:'Альпийская Долина', image:'images/biome_alpine.png', bg1:'#a4c8e1', bg2:'#599670', colors:['#26633b', '#1d4a2c', '#388e53'], woodVal:15, treeHp:5, unlocked:true, price:0},
  {id:'snow', name:'Заснеженный Пик', image:'images/biome_snow.png', bg1:'#c5d8e6', bg2:'#839dae', colors:['#3a5f75', '#243e4d', '#53829e'], woodVal:45, treeHp:12, unlocked:false, price:250},
  {id:'mystic', name:'Мистический Лес', image:'images/biome_mystic.png', bg1:'#362647', bg2:'#322443', colors:['#8e388f', '#551f56', '#b84dc0'], woodVal:110, treeHp:25, unlocked:false, price:800},
  {id:'canyon', name:'Песчаный Каньон', image:'images/biome_canyon.png', bg1:'#f3a683', bg2:'#c44569', colors:['#5a6b7c', '#3d4b58', '#7b92ab'], woodVal:250, treeHp:45, unlocked:false, price:2000},
  {id:'volcano', name:'Вулканический Пустырь', image:'images/biome_volcano.png', bg1:'#2f3542', bg2:'#57606f', colors:['#d63031', '#8b0000', '#ff7675'], woodVal:600, treeHp:75, unlocked:false, price:5000},
  {id:'space', name:'Астральный Космос', image:'images/biome_space.png', bg1:'#0f0c29', bg2:'#24243e', colors:['#00cec9', '#0984e3', '#74b9ff'], woodVal:1500, treeHp:120, unlocked:false, price:12000}
];

const furnitureCatalog=[
  {id:'carpet', name:'Персидский Ковёр', price:50, image:'images/carpet.png', w:130, h:80, layer:0},
  {id:'bed', name:'Кровать', price:100, image:'images/bed.png', w:120, h:70, layer:1},
  {id:'table', name:'Обеденный Стол', price:60, image:'images/table.png', w:90, h:55, layer:1},
  {id:'chair', name:'Кресло', price:45, image:'images/chair.png', w:50, h:50, layer:1},
  {id:'plant', name:'Комнатное Дерево', price:65, image:'images/plant.png', w:40, h:40, layer:2},
  {id:'tv', name:'Плазменный ТВ', price:200, image:'images/tv.png', w:80, h:50, layer:2}
];

const loadedImages = {};

biomes.forEach(biome => {
  const bImg = new Image();
  bImg.src = biome.image;
  loadedImages[biome.id] = bImg;
});

furnitureCatalog.forEach(item => {
  const img = new Image();
  img.src = item.image;
  loadedImages[item.id] = img;
});

axes.forEach(a => {
  const img = new Image();
  img.src = a.image;
  loadedImages[a.id] = img;
});

function saveGame(){
  const saveData = {
    money, wood, axe, hasAxe, currentBiome, unlockedFloors, firstWoodSold,
    ownedAxes: axes.map(a => a.owned),
    unlockedBiomes: biomes.map(b => b.unlocked),
    placedFurniture
  };
  localStorage.setItem('lumberjack_save', JSON.stringify(saveData));
}

function loadGame(){
  const dataStr = localStorage.getItem('lumberjack_save');
  if(!dataStr) return;
  try {
    const saveData = JSON.parse(dataStr);
    if(saveData.money !== undefined) money = saveData.money;
    if(saveData.wood !== undefined) wood = saveData.wood;
    if(saveData.axe !== undefined) axe = saveData.axe;
    if(saveData.hasAxe !== undefined) hasAxe = saveData.hasAxe;
    if(saveData.currentBiome !== undefined) currentBiome = saveData.currentBiome;
    if(saveData.unlockedFloors !== undefined) unlockedFloors = saveData.unlockedFloors;
    if(saveData.firstWoodSold !== undefined) firstWoodSold = saveData.firstWoodSold;
    if(saveData.ownedAxes && Array.isArray(saveData.ownedAxes)){
      saveData.ownedAxes.forEach((owned, idx) => {
        if(axes[idx]) axes[idx].owned = owned;
      });
    }
    if(saveData.unlockedBiomes && Array.isArray(saveData.unlockedBiomes)){
      saveData.unlockedBiomes.forEach((unlocked, idx) => {
        if(biomes[idx]) biomes[idx].unlocked = unlocked;
      });
    }
    if(saveData.placedFurniture && Array.isArray(saveData.placedFurniture)){
      placedFurniture = saveData.placedFurniture.map(f => {
        let cat = furnitureCatalog.find(c => c.id === f.id);
        return {
          ...f,
          flipX: f.flipX || false,
          scale: f.scale || 1,
          layer: f.layer !== undefined ? f.layer : (cat ? cat.layer : 1)
        };
      });
    }
  } catch(e) {
    console.error('Ошибка загрузки:', e);
  }
}

function resize(){world.width=W;world.height=H;cc.width=W;cc.height=H} 
resize(); addEventListener('resize',resize);

function toast(t){
  const e=document.getElementById('toast');
  e.textContent=t; e.style.display='block';
  clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2000);
}

function isNearShopArea(x, y){ return (x >= 430 && x <= 770 && y >= 120 && y <= 450); }

function getRandomTreePos(){
  let x, y, safe = false;
  while(!safe){
    x = 60 + Math.random() * 1080;
    y = 290 + Math.random() * 370;

function drawAxeSprite(ctx, x, y, axeData, angle, maxDimension = 130){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  if(axeData.glow){ 
    ctx.shadowColor = axeData.glow; 
    ctx.shadowBlur = 30; 
  }

  let img = loadedImages[axeData.id];
  if(img && img.complete && img.naturalWidth !== 0){
    let aspect = img.naturalWidth / img.naturalHeight;
    let w, h;

    if(aspect >= 1){
      w = maxDimension;
      h = maxDimension / aspect;
    } else {
      h = maxDimension;
      w = maxDimension * aspect;
    }

    ctx.drawImage(img, -w/2, -h + 20, w, h);
  } else {
    ctx.fillStyle = '#888'; 
    ctx.fillRect(-8, -100, 16, 120);
  }

  ctx.restore();
}

function drawWorld(){
 ctx.clearRect(0,0,W,H);
 ctx.save();
 if(screenShake>0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);

 if(currentZone==='world'){
    let b=biomes[currentBiome];
    
    // Небо с учётом ночной темы
    let grad=ctx.createLinearGradient(0,0,0,300);
    if (isNight) {
      grad.addColorStop(0, '#0a0e17'); grad.addColorStop(1, '#1a233a');
    } else {
      grad.addColorStop(0, b.bg1); grad.addColorStop(1, '#eef6fb');
    }
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,300);

    // Звёзды ночью
    if (isNight) {
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = 0.3 + Math.sin(performance.now() * 0.003 + s.x) * 0.4;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0;
    }

    // Горы на заднем плане
    ctx.fillStyle = isNight ? '#08101a' : '#00000018';
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(-50,260);
      for(let x=0;x<=W+50;x+=100) ctx.lineTo(x, 180 + Math.sin(x*0.01 + i)*40 + i*20);
      ctx.lineTo(W+50,300); ctx.fill();
    }

    // Земля с затемнением ночью
    ctx.fillStyle = isNight ? '#1b3b28' : b.bg2; 
    ctx.fillRect(0,260,W,440);
    ctx.fillStyle='rgba(0,0,0,0.06)';
    for(let y=270;y<H;y+=20) ctx.fillRect(0,y,W,8);

    drawStore();

    let renderList = trees.map(t => ({type: 'tree', y: t.y, data: t}));
    renderList.push({type: 'player', y: player.y, data: player});
    renderList.sort((a, b) => a.y - b.y);

    renderList.forEach(item => {
      if(item.type === 'tree') drawDetailedTree(item.data.x, item.data.y, item.data.type, item.data.scale);
      else if(!editMode || currentZone!=='home') drawLumberjack(player.x, player.y);
    });

 } else if(currentZone==='home'){
    drawHomeInterior();
    if(!editMode || currentZone!=='home') drawLumberjack(player.x, player.y);
 }

 updateAndDrawParticles();
 ctx.restore();
}

function drawDetailedTree(x, y, type, scale) {
  ctx.save();
  let isBehind = (player.y < y) && (Math.abs(player.x - x) < 45) && (Math.abs(player.y - y) < 85);
  if(isBehind) ctx.globalAlpha = 0.75;

  ctx.translate(x, y);
  
  let wind = Math.sin(performance.now() * 0.002 + x) * 2;
  ctx.scale(scale, scale);

  let b = biomes[type];

  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 12, 32, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  let trunkGrad = ctx.createLinearGradient(-12, 0, 12, 0);
  trunkGrad.addColorStop(0, '#2e1c11');
  trunkGrad.addColorStop(0.4, '#4e321f');
  trunkGrad.addColorStop(1, '#23140a');
  
  ctx.fillStyle = trunkGrad;
  ctx.beginPath();
  ctx.moveTo(-12, 14);
  ctx.lineTo(-8, -25);
  ctx.lineTo(8, -25);
  ctx.lineTo(12, 14);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-2, -15, 3, 20);
  ctx.beginPath();
  ctx.arc(4, -5, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(wind, 0);

  let foliageClusters = [
    {x: -18, y: -35, r: 24},
    {x: 18, y: -35, r: 24},
    {x: -22, y: -55, r: 20},
    {x: 22, y: -55, r: 20},
    {x: 0, y: -75, r: 26},
    {x: 0, y: -45, r: 28}
  ];

  ctx.fillStyle = b.colors[1] || '#1d4a2c';
  foliageClusters.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y + 3, c.r + 2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = b.colors[0] || '#26633b';
  foliageClusters.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = b.colors[2] || '#388e53';
  foliageClusters.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x - c.r * 0.2, c.y - c.r * 0.25, c.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.arc(-4, -85, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function getFurnitureRenderDimensions(item, img){
  let baseW = item.w, baseH = item.h;
  if(img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0){
    let aspectRatio = img.naturalWidth / img.naturalHeight;
    baseH = baseW / aspectRatio;
  }
  let customScale = item.scale !== undefined ? item.scale : 1;
  return { w: baseW * customScale, h: baseH * customScale };
}

function drawHomeInterior(){
 ctx.fillStyle = isNight ? '#0b1319' : '#1e272c';
 ctx.fillRect(0, 0, W, H);

 ctx.fillStyle = isNight ? '#8c613e' : '#c89666';
 ctx.fillRect(100, 120, W - 200, H - 200);

 ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 2;
 for(let x = 100; x < W - 100; x += 40){
   ctx.beginPath(); ctx.moveTo(x, 120); ctx.lineTo(x, H - 80); ctx.stroke();
 }
 for(let y = 120; y < H - 80; y += 40){
   ctx.beginPath(); ctx.moveTo(100, y); ctx.lineTo(W - 100, y); ctx.stroke();
 }

 ctx.fillStyle = isNight ? '#0a0e10' : '#141a1d';
 ctx.fillRect(0, 0, W, 120);
 ctx.fillRect(0, H - 80, W, 80);
 ctx.fillRect(0, 0, 100, H);
 ctx.fillRect(W - 100, 0, 100, H);

 ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 6;
 ctx.strokeRect(100, 120, W - 200, H - 200);

 ctx.fillStyle='#ffd65a'; ctx.font='bold 20px sans-serif';
 ctx.fillText(`${currentFloor}-й ЭТАЖ`, 120, 50);

 let currentItems = placedFurniture.filter(f => f.floor === currentFloor);
 
 currentItems.sort((a,b) => {
    let layerA = a.layer !== undefined ? a.layer : 1;
    let layerB = b.layer !== undefined ? b.layer : 1;
    if(layerA !== layerB) return layerA - layerB;
    return a.y - b.y;
 });

 currentItems.forEach(f => {
    let img = loadedImages[f.id];
    let dims = getFurnitureRenderDimensions(f, img);
    let actualW = dims.w;
    let actualH = dims.h;

    ctx.save();
    ctx.translate(f.x + actualW/2, f.y + actualH/2);

    if(f.flipX) ctx.scale(-1, 1);

    let rw = actualW, rh = actualH;
    let rx = -rw/2, ry = -rh/2;

    if(img && img.complete && img.naturalWidth !== 0) {
      ctx.drawImage(img, rx, ry, rw, rh);
    } else {
      ctx.fillStyle = '#6b705c';
      ctx.fillRect(rx, ry, rw, rh);
    }

    if(editMode){
      ctx.strokeStyle = (selectedItem === f || draggingItem === f) ? '#ffea00' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(rx, ry, rw, rh);
    }

    ctx.restore();
 });
}

          axe = idx;
          hasAxe = true;
          saveGame(); updateHUD(); renderShop('axes'); toast(`Экипирован: ${a.name}`);
        } else if(!isOwned && money>=a.price){
          money -= a.price;
          a.owned = true;
          axe = idx;
          hasAxe = true;
          saveGame(); updateHUD(); renderShop('axes'); toast(`Куплен и экипирован: ${a.name}`);
        } else if(!isOwned && money < a.price){
          toast('Недостаточно денег!');
        }
      };
      grid.appendChild(div);
    });
    shopContent.appendChild(grid);
 } else if(tab==='biomes'){
    let grid = document.createElement('div'); grid.className = 'grid-items';
    biomes.forEach((b,idx)=>{
      let div=document.createElement('div'); div.className='card';
      let status = b.unlocked ? (currentBiome===idx?'Текущий':'Перейти') : b.price+' $';
      div.innerHTML=`
        <h3><img class="card-preview" src="${b.image}" alt=""> ${b.name}</h3>
        <p>❤️ Дерево HP: ${b.treeHp}<br>💵 Цена дерева: ${b.woodVal} $</p>
        <button class="btn-buy" ${currentBiome===idx?'disabled':''}>${status}</button>
      `;
      div.querySelector('button').onclick=()=>{
        if(!b.unlocked && money>=b.price){
          money-=b.price; b.unlocked=true; currentBiome=idx; spawnTrees();
          saveGame(); updateHUD(); renderShop('biomes'); toast(`Локация открыта!`);
        } else if(b.unlocked){ 
          currentBiome=idx; spawnTrees(); saveGame(); updateHUD(); renderShop('biomes'); toast('Локация изменена!'); 
        } else {
          toast('Недостаточно денег!');
        }
      };
      grid.appendChild(div);
    });
    shopContent.appendChild(grid);
 } else if(tab==='furniture'){
    let buyGrid = document.createElement('div');
    buyGrid.className = 'grid-items';

    furnitureCatalog.forEach(f => {
      let div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <h3><img class="card-preview" src="${f.image}" alt=""> ${f.name}</h3>
        <p>Размер: ${f.w}x${f.h}</p>
        <button class="btn-buy">${f.price} $</button>
      `;
      div.querySelector('button').onclick = () => {
        if(money >= f.price){
          money -= f.price;
          placedFurniture.push({
            id: f.id, x: 500 + Math.random()*100, y: 350 + Math.random()*100, 
            w: f.w, h: f.h, floor: currentFloor, flipX: false, scale: 1, layer: f.layer
          });
          saveGame();
          updateHUD();
          renderShop('furniture');
          toast('Мебель куплена!');
        } else {
          toast('Недостаточно денег!');
        }
      };
      buyGrid.appendChild(div);
    });
    shopContent.appendChild(buyGrid);

 } else if(tab==='house'){
    let grid = document.createElement('div'); grid.className = 'grid-items';
    const floorsData = [
      {num:2, price:500, name:'Второй этаж'},
      {num:3, price:1500, name:'Третий этаж'}
    ];
    floorsData.forEach(fl => {
      let div=document.createElement('div'); div.className='card';
      let bought = unlockedFloors >= fl.num;
      div.innerHTML=`<h3>🏛️ ${fl.name}</h3><p>Новая комната для мебели</p>
      <button class="btn-buy" ${bought?'disabled':''}>${bought?'Куплено':fl.price+' $'}</button>`;
      div.querySelector('button').onclick=()=>{
        if(money>=fl.price && unlockedFloors === fl.num-1){
          money-=fl.price; unlockedFloors=fl.num;
          saveGame(); updateHUD(); renderShop('house'); toast(`${fl.name} открыт!`);
        } else if(unlockedFloors < fl.num-1){
          toast('Сначала купи предыдущий этаж!');
        }
      };
      grid.appendChild(div);
    });
    shopContent.appendChild(grid);
 }
}

document.getElementById('tabAxes').onclick=()=>renderShop('axes');
document.getElementById('tabBiomes').onclick=()=>renderShop('biomes');
document.getElementById('tabFurniture').onclick=()=>renderShop('furniture');
document.getElementById('tabHouse').onclick=()=>renderShop('house');
document.getElementById('closeShop').onclick=()=>shopModal.style.display='none';

document.getElementById('btnWorld').onclick=()=>{ switchZone('world'); toggleNav('btnWorld'); };
document.getElementById('btnHome').onclick=()=>{ switchZone('home'); toggleNav('btnHome'); };
document.getElementById('btnShop').onclick=()=>{ openShop('axes'); };

const btnEdit = document.getElementById('btnEdit');
const btnFlip = document.getElementById('btnFlip');
const btnScaleUp = document.getElementById('btnScaleUp');
const btnScaleDown = document.getElementById('btnScaleDown');

btnEdit.onclick=()=>{
  editMode = !editMode;
  btnEdit.classList.toggle('edit-active', editMode);
  btnFlip.style.display = editMode ? 'block' : 'none';
  btnScaleUp.style.display = editMode ? 'block' : 'none';
  btnScaleDown.style.display = editMode ? 'block' : 'none';
  if(!editMode) saveGame();
  toast(editMode ? 'Режим редактирования ВКЛ' : 'Режим редактирования ВЫКЛ');
};

btnFlip.onclick=()=>{
  if(selectedItem){
    selectedItem.flipX = !selectedItem.flipX;
    saveGame();
    toast('Предмет отзеркален!');
  } else {
    toast('Сначала выбери предмет!');
  }
};

btnScaleUp.onclick=()=>{
  if(selectedItem){
    selectedItem.scale = Math.min(2.5, (selectedItem.scale || 1) + 0.15);
    saveGame();
    toast(`Размер увеличен (${Math.round(selectedItem.scale * 100)}%)`);
  } else {
    toast('Сначала выбери предмет!');
  }
};

btnScaleDown.onclick=()=>{
  if(selectedItem){
    selectedItem.scale = Math.max(0.4, (selectedItem.scale || 1) - 0.15);
    saveGame();
    toast(`Размер уменьшен (${Math.round(selectedItem.scale * 100)}%)`);
  } else {
    toast('Сначала выбери предмет!');
  }
};

function switchZone(zone){
  currentZone = zone;
  const isHome = currentZone === 'home';
  document.getElementById('homeControls').style.display = isHome ? 'flex' : 'none';
  document.getElementById('worldSelector').style.display = isHome ? 'none' : 'flex';
  btnEdit.style.display = isHome ? 'block' : 'none';
  btnFlip.style.display = (isHome && editMode) ? 'block' : 'none';
  btnScaleUp.style.display = (isHome && editMode) ? 'block' : 'none';
  btnScaleDown.style.display = (isHome && editMode) ? 'block' : 'none';
  if(!isHome && editMode){
    editMode = false;
    btnEdit.classList.remove('edit-active');
    saveGame();
  }
}

function setFloor(fl){
  if(fl <= unlockedFloors){
    currentFloor = fl;
    document.querySelectorAll('.control-btn').forEach((b, idx)=> {
      if(idx < 3) b.classList.toggle('active', (idx+1)===fl);
    });
  }
}

document.getElementById('btnFloor1').onclick=()=>setFloor(1);
document.getElementById('btnFloor2').onclick=()=>setFloor(2);
document.getElementById('btnFloor3').onclick=()=>setFloor(3);

function toggleNav(id){
 document.querySelectorAll('.nav-tabs .nav-btn').forEach(b=>{
   if(b!==btnEdit && b!==btnFlip && b!==btnScaleUp && b!==btnScaleDown) b.classList.remove('active');
 });
 document.getElementById(id).classList.add('active');
}

function getCanvasPos(e){
  let rect = world.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}

function findFurnitureAt(x, y){
  let items = placedFurniture.filter(f => f.floor === currentFloor);
  items.sort((a,b) => {
    let layerA = a.layer !== undefined ? a.layer : 1;
    let layerB = b.layer !== undefined ? b.layer : 1;
    if(layerA !== layerB) return layerA - layerB;
    return a.y - b.y;
  });

  for(let i = items.length - 1; i >= 0; i--){
    let f = items[i];
    let img = loadedImages[f.id];
    let dims = getFurnitureRenderDimensions(f, img);
    let actualW = dims.w;
    let actualH = dims.h;

    if(x >= f.x && x <= f.x + actualW && y >= f.y && y <= f.y + actualH){
      return f;
    }
  }
  return null;
}

let lastTapTime = 0;

function handlePointerDown(e){
  if(currentZone !== 'home' || !editMode) return;
  let pos = getCanvasPos(e);
  let item = findFurnitureAt(pos.x, pos.y);
  
  if(item){
    let now = Date.now();
    selectedItem = item;

    if(now - lastTapTime < 300 && draggingItem === item){
      item.flipX = !item.flipX;
      saveGame();
      toast('Предмет отзеркален!');
      lastTapTime = 0;
      return;
    }

    draggingItem = item;
    dragOffsetX = pos.x - item.x;
    dragOffsetY = pos.y - item.y;
    lastTapTime = now;
  } else {
    selectedItem = null;
  }
}

function handlePointerMove(e){
  if(!editMode || !draggingItem) return;
  let pos = getCanvasPos(e);
  let newX = pos.x - dragOffsetX;
  let newY = pos.y - dragOffsetY;

  let img = loadedImages[draggingItem.id];
  let dims = getFurnitureRenderDimensions(draggingItem, img);
  let actualW = dims.w;
  let actualH = dims.h;

  newX = Math.max(100, Math.min(W - 100 - actualW, newX));
  newY = Math.max(120, Math.min(H - 80 - actualH, newY));

  draggingItem.x = newX;
  draggingItem.y = newY;
}

function handlePointerUp(){
  if(draggingItem){
    saveGame();
  }
  draggingItem = null;
}

world.addEventListener('wheel', (e) => {
  if(currentZone !== 'home' || !editMode) return;
  let pos = getCanvasPos(e);
  let item = findFurnitureAt(pos.x, pos.y) || selectedItem;
  if(item){
    e.preventDefault();
    let delta = e.deltaY < 0 ? 0.1 : -0.1;
    item.scale = Math.max(0.4, Math.min(2.5, (item.scale || 1) + delta));
    selectedItem = item;
    saveGame();
  }
}, {passive: false});

world.addEventListener('mousedown', handlePointerDown);
world.addEventListener('mousemove', handlePointerMove);
world.addEventListener('mouseup', handlePointerUp);

world.addEventListener('touchstart', handlePointerDown, {passive:false});
world.addEventListener('touchmove', handlePointerMove, {passive:false});
world.addEventListener('touchend', handlePointerUp);

function shopInteract(){
 if(nearShop()){
    if(wood>0){
      let val = biomes[currentBiome].woodVal;
      let earned = wood * val;
      money += earned; toast(`Продано на ${earned} $!`);
      wood = 0; 
      firstWoodSold = true;
      saveGame();
      updateHUD();
    } else openShop();
 }
}

function treeInteract(){
 if(!hasAxe) return toast('Сначала купи топор в магазине!');
 const t=nearestTree();
 if(t) startChop(t);
}

document.getElementById('shopAction').onclick=shopInteract;
document.getElementById('chopAction').onclick=treeInteract;

function startChop(t){
 chopping=true; currentTree=t; progress=0; needlePos=0; needleDir=1; axeSwingAnim=0;
 chop.style.display='block';
 document.querySelector('.actionbar').style.display='none';
 document.getElementById('joystickArea').style.display='none';
 updateChopHP();
}

function stopChop(){
 chopping=false; currentTree=null; chop.style.display='none';
 document.querySelector('.actionbar').style.display='flex';
 if(isTouchDevice) document.getElementById('joystickArea').style.display='block';
}

function chopHit(){
 if(!chopping || !hasAxe) return;
 axeSwingAnim = 1.0;

 if(needlePos>=38 && needlePos<=62){
    progress += axes[axe].power;
    screenShake = 10;
    addSparks(W/2 + 130, H/2);
    updateChopHP();
    
    if(progress>=currentTree.maxHp){
      wood += 1;
      addSparks(currentTree.x, currentTree.y);
      trees = trees.filter(t => t !== currentTree);
      createSingleTree();
      stopChop(); 
      saveGame();
      updateHUD();
      toast(`Срублено! +1 🪵`);
    }
 } else {
    toast('Промах!');
 }
}

document.getElementById('hitAction').onclick=chopHit;

cc.addEventListener('touchstart', (e) => {
  e.preventDefault();
  chopHit();
}, {passive: false});

addEventListener('keydown',e=>{
 let k=e.key.toLowerCase(); keys[k]=true;
 if(e.key==='Escape'){ 
    shopModal.style.display='none'; 
    if(chopping) stopChop(); 
 }
 if(e.key===' '||k==='e'||k==='у'){
    if(chopping) chopHit();
    else if(nearShop()) shopInteract();
    else treeInteract();
 }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joyX=0, joyY=0, joyActive=false;
const joyArea=document.getElementById('joystickArea'), joyStick=document.getElementById('joystickStick');

if(isTouchDevice) joyArea.style.display='block';

function handleTouch(e){
 if(!joyActive) return;
 let t=e.touches[0], r=joyArea.getBoundingClientRect();
 let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
 let dist=Math.hypot(dx,dy), maxR=r.width/2;
 if(dist>maxR){ dx=(dx/dist)*maxR; dy=(dy/dist)*maxR; }
 joyX=dx/maxR; joyY=dy/maxR;
 joyStick.style.transform=`translate(${dx}px,${dy}px)`;
}
joyArea.addEventListener('touchstart',e=>{joyActive=true;handleTouch(e);e.preventDefault();});
joyArea.addEventListener('touchmove',e=>{handleTouch(e);e.preventDefault();});
joyArea.addEventListener('touchend',e=>{joyActive=false;joyX=0;joyY=0;joyStick.style.transform='none';});

function update(dt){
 let speed = 240 * dt;

 if(!chopping && shopModal.style.display!=='flex'){
    let dx=0, dy=0;
    if(keys.w||keys.arrowup||keys.ц) dy -= 1;
    if(keys.s||keys.arrowdown||keys.ы) dy += 1;
    if(keys.a||keys.arrowleft||keys.ф) dx -= 1;
    if(keys.d||keys.arrowright||keys.в) dx += 1;

    if(joyActive){ dx=joyX; dy=joyY; }

    let nextX = player.x + dx * speed;
    let nextY = player.y + dy * speed;

    if(dx!==0 || dy!==0) player.walkFrame += dt * 12;

    let minX = 20, maxX = W - 20;
    let minY = currentZone === 'home' ? 140 : 280;
    let maxY = H - 20;

    nextX = Math.max(minX, Math.min(maxX, nextX));
    nextY = Math.max(minY, Math.min(maxY, nextY));

    if(currentZone === 'world'){
      let pRadius = 12;
      let inShopX = (nextX + pRadius > shopBounds.x) && (nextX - pRadius < shopBounds.x + shopBounds.w);
      let inShopY = (nextY + pRadius > shopBounds.y) && (nextY - pRadius < shopBounds.y + shopBounds.h);

      if(inShopX && inShopY){
        if(player.x + pRadius <= shopBounds.x || player.x - pRadius >= shopBounds.x + shopBounds.w) nextX = player.x;
        if(player.y + pRadius <= shopBounds.y || player.y - pRadius >= shopBounds.y + shopBounds.h) nextY = player.y;
      }
    }

    player.x = nextX;
    player.y = nextY;

    const shopBtn=document.getElementById('shopAction');
    const chopBtn=document.getElementById('chopAction');
    shopBtn.disabled = !nearShop();
    shopBtn.textContent = nearShop() ? (wood>0?'🛒 СДАТЬ ДЕРЕВО':'🛒 МАГАЗИН') : '🛒 МАГАЗИН';
    chopBtn.disabled = !hasAxe || !nearestTree();
 } else if(chopping && hasAxe && axes[axe]){
    let sp = axes[axe].speed;
    needlePos += needleDir * sp * dt;
    if(needlePos>100){ needlePos=100; needleDir=-1; }
    if(needlePos<0){ needlePos=0; needleDir=1; }
    document.getElementById('needle').style.left = needlePos+'%';

    if(axeSwingAnim > 0){
      axeSwingAnim -= dt * 5;
      if(axeSwingAnim < 0) axeSwingAnim = 0;
    }
 }

 if(screenShake>0) screenShake-=dt*30;
}

function drawChopScene(){
 cctx.clearRect(0,0,W,H);
 let b = biomes[currentBiome];
 cctx.fillStyle = isNight ? '#0b101d' : b.bg2; 
 cctx.fillRect(0, 0, W, H);

 cctx.fillStyle = 'rgba(0,0,0,0.08)';
 for(let y=0; y<H; y+=24) cctx.fillRect(0, y, W, 10);

 const bw = 300;
 const bx = (W - bw) / 2 - 50;

 cctx.fillStyle = 'rgba(0,0,0,0.3)'; cctx.fillRect(bx - 20, 0, bw + 40, H);

 cctx.fillStyle = '#4e321f'; cctx.fillRect(bx, 0, bw, H);
 cctx.fillStyle = '#362214'; cctx.fillRect(bx + 30, 0, 45, H); cctx.fillRect(bx + 140, 0, 30, H);

 b.colors.forEach((c, idx) => {
    cctx.fillStyle = c;
    cctx.beginPath();
    cctx.arc(bx + bw/2 + (idx - 1) * 60, -30, 180 - idx * 20, 0, Math.PI * 2);
    cctx.fill();
 });

 if(hasAxe && axes[axe]){
    let baseAngle = -Math.PI / 4;
    let swing = Math.sin(axeSwingAnim * Math.PI) * 0.8;
    let axeAngle = baseAngle + swing;
    let axeX = bx + bw + 110 - Math.sin(axeSwingAnim * Math.PI) * 60;
    let axeY = H/2 + 80;

    drawAxeSprite(cctx, axeX, axeY, axes[axe], axeAngle, 240);
 }
}

function loop(now){
 let dt = (now - lastTime)/1000;
 if(dt>0.1) dt=0.1;
 lastTime=now;

 update(dt);

 if(chopping) drawChopScene();
 else { drawWorld(); hint(); }

 requestAnimationFrame(loop);
}

if(axe === -1) {
  axe = 0;
  hasAxe = true;
  axes[0].owned = true;
}

updateHUD();
requestAnimationFrame(loop);
</script>
